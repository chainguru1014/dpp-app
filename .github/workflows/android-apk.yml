name: Build Android APK

# Run manually from the GitHub "Actions" tab -> "Build Android APK" -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      # The repo only ships gradlew.bat, so install the same Gradle the wrapper pins.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # react-qr-reader@2 declares a react@~16 peer; the project runs on React 18.
      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;23.1.7779620" > /dev/null

      # gradle.properties points org.gradle.java.home at a Windows-only JDK path
      # and asks for a 6 GB heap; neither fits the Linux runner.
      - name: Adapt gradle.properties for CI
        working-directory: android
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          sed -i 's/-Xmx6144m/-Xmx4g/' gradle.properties

      # Release keystore is gitignored; it comes from the ANDROID_KEYSTORE_BASE64 secret.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/chris_yometel.keystore

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
