<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover lets the page draw into the notch/home-indicator
         safe areas (env(safe-area-inset-*) resolves to 0 without it, so
         react-native-safe-area-context's useSafeAreaInsets() always reports
         zero and the top/bottom bars stop short of the true screen edge --
         the OS then fills that gap with its own default (white) chrome. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Colors the Android status bar / task-switcher chrome so it blends
         with the app instead of showing a default white/grey bar. -->
    <meta name="theme-color" content="#1b4f72">
    <!-- iOS "Add to Home Screen" standalone mode: capable+status-bar-style
         are what actually let content extend under the status bar on iOS
         (the Web App Manifest's display/theme_color are not enough there).
         "black-translucent" is the usual choice for edge-to-edge content,
         but on current iOS it sizes the layout viewport as if a status bar
         were still reserved while env(safe-area-inset-bottom) resolves to 0
         -- content can land shifted from the top AND our bottom bar's
         `bottom: 0` lands short of the true screen edge, leaving an
         unreachable band below it (both gaps this pass is fixing). "default"
         reserves an ordinary opaque status bar instead of overlaying a
         translucent one, but reports safe-area insets correctly, which is
         the actual requirement here -- our own bars sit flush against it. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Yometel DPP">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-512.png">
    <title>Yometel DPP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            /* Matches the app's top-bar navy so any sliver visible before
               React mounts (or outside the flex #root on an odd viewport)
               reads as "app chrome," not a stray white gap. */
            background-color: #1b4f72;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
