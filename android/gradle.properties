# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:ReservedCodeCacheSize=512m -Xss2m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=false

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
# arm64-v8a-only was previously set here "for faster emulator builds", but
# react-native-vision-camera compiles its own native library per-ABI (unlike
# precompiled-AAR libraries such as Hermes/react-native core, which ship all
# ABIs regardless of this setting) -- restricting to arm64-v8a only means
# libVisionCamera.so silently doesn't exist for any other ABI, so the WHOLE
# APP crashes on launch (UnsatisfiedLinkError) on an x86_64 emulator, and
# would do the same on any 32-bit ARM (armeabi-v7a) real device. Build all
# four so it actually runs everywhere.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchitectureEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Suppress warning for compileSdk 34,35
android.suppressUnsupportedCompileSdk=34,35

# react-native-vision-camera v4 ships the code scanner (ML Kit barcode model)
# as opt-in — v3 bundled it unconditionally. The whole app's QR/barcode scan
# + corporate capture flow depends on <Camera codeScanner={...}>, so it MUST
# be enabled here or onCodeScanned never fires on Android.
VisionCamera_enableCodeScanner=true

# Frame Processors stay disabled (this app deliberately carries no
# Reanimated / react-native-worklets-core — see REANIMATED_FIX.md). v4
# auto-disables them when worklets-core is absent; setting it explicitly
# keeps the intent obvious and the CMake build lean.
VisionCamera_enableFrameProcessors=false

# Disable R8 full mode to avoid StackOverflowError during dexing
# This is a workaround for R8 circular reference issue with Kotlin metadata
android.enableR8.fullMode=false

# JAVA_HOME on this machine points to a missing "C:\Program Files\Java\jdk-17" (Zulu 8
# is what's actually on PATH). AGP 8.1.4 requires JDK 17+ to run the build itself, so the
# fallback to JDK 8 was the real cause of the dexing StackOverflowError, not R8/Kotlin.
# Android Studio's bundled JBR works for running Gradle itself, but ships without the
# jmods/ directory, so jlink (needed by core library desugaring's JdkImageTransform)
# fails there -- use a full standalone JDK 17 distro (has jmods) instead.
org.gradle.java.home=C\:\\Program Files\\Microsoft\\jdk-17.0.20.8-hotspot
