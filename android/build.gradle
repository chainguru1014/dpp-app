// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // buildTools + compileSdk bumped to 35 for react-native-vision-camera v4:
        // it pulls androidx.camera (CameraX) 1.5.0-alpha03, whose AARs are
        // compiled against API 35 and fail to link against compileSdk 34.
        // targetSdk stays at 34 on purpose — bumping the *target* opts into
        // Android 15 behaviour changes (edge-to-edge enforcement etc.) and is
        // a separate product decision. compileSdk 35 + targetSdk 34 is valid.
        // AGP 8.1.4 accepts compileSdk 35 via android.suppressUnsupportedCompileSdk
        // (already set in gradle.properties).
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "23.1.7779620"
        kotlinVersion = "1.8.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "11"
            freeCompilerArgs += ["-Xjvm-default=all", "-Xskip-metadata-version-check"]
        }
    }
    configurations.all {
        resolutionStrategy {
            force("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
            force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion")
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null) {
                    // @react-native-ml-kit/barcode-scanning 2.0.0's own build.gradle
                    // doesn't declare a namespace, and the generic `project.group`
                    // fallback below doesn't match the package="com.rnmlkit.barcodescanning"
                    // attribute in its AndroidManifest.xml -- AGP 8 treats that
                    // mismatch as a hard error ("Incorrect package=... found"),
                    // not just the deprecation warning it logs for every other
                    // autolinked library here. Pin it explicitly to match.
                    if (project.name == 'react-native-ml-kit_barcode-scanning') {
                        namespace 'com.rnmlkit.barcodescanning'
                    } else {
                        namespace project.group
                    }
                }
                buildFeatures {
                    buildConfig true
                }
            }
        }
        project.dependencies {
            // Add AndroidX Activity for react-native-image-picker Photo Picker API
            if (project.name.contains('react-native-image-picker')) {
                implementation("androidx.activity:activity:1.6.1")
            }
        }
    }
}